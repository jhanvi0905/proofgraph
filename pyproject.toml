[project]
name = "proofgraph"
version = "0.1.0"
description = "Verifies AI conclusions against documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.162.0",
    "networkx>=3.6.1",
    "openai",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pydantic>=2",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "streamlit",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
