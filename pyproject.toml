[project]
name = "proofgraph"
version = "0.1.0"
description = "Verifies AI conclusions against documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
