[project]
name = "proofgraph"
version = "2.0.0.dev0"
description = "Decides whether versioned insurance documents support a claim, and which document governs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic==2.12.0",
    "numpy==2.4.6",
    "pdfplumber==0.11.10",
    "pydantic==2.12.5",
    "rank-bm25==0.2.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pgrun = "proofgraph.cli:main"
