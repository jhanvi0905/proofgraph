<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Held-out check on 30 ContractNLI pairs: no graph 15 of 30 correct, case-by-case patches 9 of 30, ProofGraph 19 of 30, with 95 percent intervals that overlap">
  <rect width="900" height="330" rx="10" fill="#FFFFFF" stroke="#B9C8B5"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="20" fill="#262B2A" font-weight="700">Held-out check: 30 ContractNLI pairs not used while building</text>
  <text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5A6560">Share correct, with the 95% Wilson interval. Gold is the dataset's published label.</text>
  <!-- axis -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5A6560" text-anchor="middle">
    <line x1="270" y1="92" x2="270" y2="244" stroke="#DDE5DA"/><text x="270" y="262">0%</text>
    <line x1="410" y1="92" x2="410" y2="244" stroke="#DDE5DA"/><text x="410" y="262">25%</text>
    <line x1="550" y1="92" x2="550" y2="244" stroke="#DDE5DA"/><text x="550" y="262">50%</text>
    <line x1="690" y1="92" x2="690" y2="244" stroke="#DDE5DA"/><text x="690" y="262">75%</text>
    <line x1="830" y1="92" x2="830" y2="244" stroke="#DDE5DA"/><text x="830" y="262">100%</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#262B2A">
    <!-- x(p) = 270 + 5.6*p -->
    <text x="24" y="124" font-weight="600">Same pipeline, no graph</text>
    <rect x="270" y="106" width="280" height="26" fill="#9AA6A0"/>
    <line x1="455" y1="119" x2="646" y2="119" stroke="#262B2A" stroke-width="2"/><line x1="455" y1="111" x2="455" y2="127" stroke="#262B2A" stroke-width="2"/><line x1="646" y1="111" x2="646" y2="127" stroke="#262B2A" stroke-width="2"/>
    <text x="660" y="124" font-weight="700">15/30</text>

    <text x="24" y="174" font-weight="600">Case-by-case patches (run 1)</text>
    <rect x="270" y="156" width="168" height="26" fill="#C9A9A4"/>
    <line x1="365" y1="169" x2="536" y2="169" stroke="#262B2A" stroke-width="2"/><line x1="365" y1="161" x2="365" y2="177" stroke="#262B2A" stroke-width="2"/><line x1="536" y1="161" x2="536" y2="177" stroke="#262B2A" stroke-width="2"/>
    <text x="550" y="174" font-weight="700">9/30</text>

    <text x="24" y="224" font-weight="600">ProofGraph (shipped)</text>
    <rect x="270" y="206" width="353" height="26" fill="#1D4F91"/>
    <line x1="522" y1="219" x2="707" y2="219" stroke="#262B2A" stroke-width="2"/><line x1="522" y1="211" x2="522" y2="227" stroke="#262B2A" stroke-width="2"/><line x1="707" y1="211" x2="707" y2="227" stroke="#262B2A" stroke-width="2"/>
    <text x="722" y="224" font-weight="700" fill="#1D4F91">19/30</text>
  </g>
  <text x="24" y="296" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5A6560">The intervals overlap at n = 30, so we say better on unseen cases, not proven better. Paired, it fixed 7 pairs and broke 3.</text>
</svg>
