<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" role="img" aria-label="Held-out check on 30 ContractNLI pairs: case-by-case patches 9 of 30 correct, general rules and a small schema 19 of 30, with 95 percent intervals">
  <rect width="900" height="262" rx="10" fill="#FFFFFF" stroke="#B9C8B5"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="20" fill="#262B2A" font-weight="700">Held-out check: general rules against case-by-case patches</text>
  <text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5A6560">30 ContractNLI pairs not used while building. Share correct, with the 95% Wilson interval. Gold is the published label.</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5A6560" text-anchor="middle">
    <line x1="270" y1="84" x2="270" y2="182" stroke="#DDE5DA"/><text x="270" y="200">0%</text>
    <line x1="410" y1="84" x2="410" y2="182" stroke="#DDE5DA"/><text x="410" y="200">25%</text>
    <line x1="550" y1="84" x2="550" y2="182" stroke="#DDE5DA"/><text x="550" y="200">50%</text>
    <line x1="690" y1="84" x2="690" y2="182" stroke="#DDE5DA"/><text x="690" y="200">75%</text>
    <line x1="830" y1="84" x2="830" y2="182" stroke="#DDE5DA"/><text x="830" y="200">100%</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#262B2A">
    <text x="24" y="112" font-weight="600">Case-by-case patches (run 1)</text>
    <rect x="270" y="94" width="168" height="26" fill="#C9A9A4"/>
    <line x1="365" y1="107" x2="536" y2="107" stroke="#262B2A" stroke-width="2"/><line x1="365" y1="99" x2="365" y2="115" stroke="#262B2A" stroke-width="2"/><line x1="536" y1="99" x2="536" y2="115" stroke="#262B2A" stroke-width="2"/>
    <text x="550" y="112" font-weight="700">9/30</text>

    <text x="24" y="162" font-weight="600">General rules (shipped)</text>
    <rect x="270" y="144" width="353" height="26" fill="#1D4F91"/>
    <line x1="522" y1="157" x2="707" y2="157" stroke="#262B2A" stroke-width="2"/><line x1="522" y1="149" x2="522" y2="165" stroke="#262B2A" stroke-width="2"/><line x1="707" y1="149" x2="707" y2="165" stroke="#262B2A" stroke-width="2"/>
    <text x="722" y="162" font-weight="700" fill="#1D4F91">19/30</text>
  </g>
  <text x="24" y="236" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5A6560">Paired: 10 pairs fixed, none broken. At n = 30 the intervals nearly touch, so read it as better on unseen cases, not proven better.</text>
</svg>
