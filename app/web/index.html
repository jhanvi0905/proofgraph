<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProofGraph: check a claim against its documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/web/tokens.css">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<div class="shell">
  <header class="brand"><h1>ProofGraph</h1><p>Check a claim against every document in the packet. See which clause decides it, on its page.</p></header>

  <form id="start" class="start" autocomplete="off">
    <div class="field">
      <label for="claim">The claim</label>
      <textarea id="claim" name="claim" rows="3" class="says" required placeholder="Connors was continuously authorized to act as Interim CMO from May 7, 2026."></textarea>
    </div>
    <div class="field">
      <label for="files">The documents</label>
      <input id="files" name="files" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" multiple required>
      <p class="help">PDF, PNG or JPG. Up to 10 files.</p>
    </div>
    <div class="field narrow">
      <label for="passcode">Passcode</label>
      <input id="passcode" name="passcode" type="password" autocomplete="current-password">
    </div>
    <button class="btn" type="submit" id="go">Check claim</button>
    <p id="problem" class="problem" role="alert" hidden></p>
  </form>

  <section id="live" class="live" aria-label="Progress" hidden>
    <p id="claim-line" class="claim-line says"></p>
    <div id="status" class="sr" role="status" aria-live="polite"></div>
    <ul id="docs" class="lines" aria-label="Documents"></ul>
    <ul id="found" class="lines quiet" aria-label="Things found"></ul>
    <p id="receipt" class="receipt" hidden></p>
    <ul id="parts" class="lines" aria-label="Parts of the claim"></ul>
    <ul id="notes" class="lines" aria-label="Notes"></ul>
  </section>

  <section id="result" class="result" aria-label="Review" hidden>
    <iframe id="review" title="Review"></iframe>
  </section>
</div>
<script src="/web/app.js"></script>
</body>
</html>
